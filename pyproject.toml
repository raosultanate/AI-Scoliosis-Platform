[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ai-scoliosis-platform"
version = "0.1.0"
description = "Version 1A landmark-driven scoliosis geometry and Cobb angle pipeline."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AI Scoliosis Platform Team" }]
dependencies = [
  "fastapi>=0.115,<1",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.9,<5",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/scoliosis_platform"]

[tool.hatch.build]
include = [
  "backend/scoliosis_platform/**/*.py",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
# ruff auto-detects a conventional `src/` directory as first-party for import
# sorting; since the package lives under `backend/` instead, declare it
# explicitly or `scoliosis_platform` imports get sorted as third-party.
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D103", "D107", "D202", "D203", "D213", "D413"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["scoliosis_platform"]
