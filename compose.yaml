name: ai-scoliosis-platform

services:
  api:
    image: ai-scoliosis-platform:local
    build:
      context: .
      target: runtime
    ports:
      - "${SCOLIOSIS_PORT:-8000}:8000"
    environment:
      SCOLIOSIS_LOG_LEVEL: "${SCOLIOSIS_LOG_LEVEL:-INFO}"
    volumes:
      - scoliosis-artifacts:/app/data/outputs/api
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    stop_grace_period: 15s

volumes:
  scoliosis-artifacts:
