name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: test / lint / typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (hash-pinned)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.lock.txt
          python -m pip install --no-deps -e .

      - name: Test
        run: python -m pytest -q --cov=src/scoliosis_platform --cov-report=term-missing

      - name: Lint
        run: python -m ruff check .

      - name: Typecheck
        run: python -m mypy src

  docker:
    name: docker build / scan / smoke test
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag ai-scoliosis-platform:ci .

      - name: Scan for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ai-scoliosis-platform:ci
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Smoke test
        run: |
          docker run -d --name smoke --publish 8000:8000 ai-scoliosis-platform:ci
          for i in $(seq 1 15); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS --request POST http://127.0.0.1:8000/api/v1/demo/synthetic
          docker logs smoke
          docker rm -f smoke
